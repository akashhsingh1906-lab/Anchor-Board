name: anchorboard-saas

services:
  # MailHog — local SMTP catcher so notification emails are genuinely sent
  # and viewable (http://localhost:8025), without needing a real mail provider.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: anchorboard-mailhog
    ports:
      - "8025:8025"
    networks:
      - anchorboard-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres: 
    image: postgres:15-alpine
    container_name: anchorboard-postgres
    environment:
      POSTGRES_DB: anchorboard_platform
      POSTGRES_USER: anchorboard_user
      POSTGRES_PASSWORD: anchorboard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anchorboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchorboard_user -d anchorboard_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: anchorboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anchorboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: anchorboard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - anchorboard-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker
  kafka:
    # cp-kafka (open-source broker), not cp-server: cp-server auto-enables
    # the Confluent Data Balancer, which requires an enterprise license
    # topic with replication factor 3 and crashes ~40 minutes after boot on
    # a single-broker setup ("Failed to start license store").
    image: confluentinc/cp-kafka:7.4.0
    container_name: anchorboard-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    networks:
      - anchorboard-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Services
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: anchorboard-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/anchorboard_platform
      SPRING_DATASOURCE_USERNAME: anchorboard_user
      SPRING_DATASOURCE_PASSWORD: anchorboard_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anchorboard-network
    restart: unless-stopped

  project-service:
    build:
      context: ./backend
      dockerfile: project-service/Dockerfile
    container_name: anchorboard-project-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/anchorboard_platform
      SPRING_DATASOURCE_USERNAME: anchorboard_user
      SPRING_DATASOURCE_PASSWORD: anchorboard_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - anchorboard-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: anchorboard-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/anchorboard_platform
      SPRING_DATASOURCE_USERNAME: anchorboard_user
      SPRING_DATASOURCE_PASSWORD: anchorboard_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - anchorboard-network
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: anchorboard-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      - auth-service
      - project-service
      - notification-service
    networks:
      - anchorboard-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anchorboard-frontend
    # NEXT_PUBLIC_* URLs are baked in at image build time (see frontend/src/lib/axios.ts
    # defaults: localhost:8081/8082/8083) since the gateway has no configured routes,
    # so the browser calls each Spring Boot service directly on its own port.
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - anchorboard-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  anchorboard-network:
    driver: bridge
