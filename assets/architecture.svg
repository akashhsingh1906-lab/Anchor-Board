<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Inter, Arial, sans-serif">
  <rect width="760" height="460" fill="#0a0f1a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="270" y="16" width="220" height="56" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">Browser</text>
  <text x="380" y="58" text-anchor="middle" fill="#8b949e" font-size="10">Next.js 16 / React 19</text>

  <line x1="380" y1="72" x2="130" y2="110" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="72" x2="380" y2="110" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="72" x2="630" y2="110" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="112" width="200" height="86" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="136" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Auth Service</text>
  <text x="130" y="152" text-anchor="middle" fill="#8b949e" font-size="10">:8081</text>
  <text x="130" y="168" text-anchor="middle" fill="#8b949e" font-size="9.5">JWT issuer, BCrypt,</text>
  <text x="130" y="182" text-anchor="middle" fill="#8b949e" font-size="9.5">RBAC, profile/pwd</text>

  <rect x="280" y="112" width="200" height="86" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="136" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Project Service</text>
  <text x="380" y="152" text-anchor="middle" fill="#8b949e" font-size="10">:8082</text>
  <text x="380" y="168" text-anchor="middle" fill="#8b949e" font-size="9.5">projects, tasks,</text>
  <text x="380" y="182" text-anchor="middle" fill="#8b949e" font-size="9.5">Kafka producer, user directory</text>

  <rect x="530" y="112" width="200" height="86" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="630" y="136" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Notification Service</text>
  <text x="630" y="152" text-anchor="middle" fill="#8b949e" font-size="10">:8083</text>
  <text x="630" y="168" text-anchor="middle" fill="#8b949e" font-size="9.5">Kafka consumer, WebSocket,</text>
  <text x="630" y="182" text-anchor="middle" fill="#8b949e" font-size="9.5">REST, real SMTP email</text>

  <line x1="130" y1="198" x2="130" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="198" x2="240" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="198" x2="450" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="262" x2="630" y2="198" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="262" x2="630" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="262" width="200" height="56" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="286" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">PostgreSQL 15</text>
  <text x="130" y="304" text-anchor="middle" fill="#8b949e" font-size="10">:5432</text>

  <rect x="330" y="262" width="230" height="56" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="445" y="286" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Kafka + Zookeeper</text>
  <text x="445" y="304" text-anchor="middle" fill="#8b949e" font-size="10">domain-events topic :9092</text>

  <rect x="530" y="312" width="200" height="56" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.5"/>
  <text x="630" y="336" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">MailHog</text>
  <text x="630" y="354" text-anchor="middle" fill="#8b949e" font-size="10">:8025</text>

  <text x="380" y="410" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">Note</text>
  <text x="380" y="430" text-anchor="middle" fill="#64748b" font-size="10">The gateway service (:8090) has no configured routes; the browser calls each service directly.</text>
</svg>
